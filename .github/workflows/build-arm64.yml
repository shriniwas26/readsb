name: Native ARM64 Build of readsb

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  native-arm64:
    runs-on: ubuntu-22.04-arm  # Native ARM64 runner!
    name: Build and Package readsb on ARM64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential make dpkg-dev debhelper \
            libzstd-dev zlib1g-dev libncurses-dev libtinfo-dev

      - name: Build readsb
        run: |
          make clean
          make -j$(nproc)

      - name: Package .deb
        run: |
          mkdir -p build/DEBIAN
          mkdir -p build/usr/local/bin
          cp readsb build/usr/local/bin

          cat <<EOF > build/DEBIAN/control
          Package: readsb
          Version: 1.0
          Architecture: arm64
          Maintainer: you@example.com
          Description: ADS-B decoder and Mode-S beast client
          EOF

          dpkg-deb --build build readsb-arm64.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: readsb-arm64
          path: readsb-arm64.deb
