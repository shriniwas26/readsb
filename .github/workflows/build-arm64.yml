name: Native ARM64 Build of readsb

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  native-arm64:
    runs-on: ubuntu-22.04-arm  # Native ARM64 runner!
    name: Build and Package readsb on ARM64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install --no-install-recommends --no-install-suggests -y \
              git build-essential debhelper libusb-1.0-0-dev \
              librtlsdr-dev librtlsdr0 pkg-config fakeroot \
              libncurses-dev zlib1g-dev zlib1g libzstd-dev libzstd1

      - name: Build readsb
        run: |
          make clean
          make -j$(nproc)

      - name: Package .deb
        run: |
          export DEB_BUILD_OPTIONS=noddebs
          dpkg-buildpackage -b -Prtlsdr -ui -uc -us

      - name: Rename .deb file
        run: |
          mv ../readsb_*.deb readsb-arm64.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: readsb-arm64
          path: readsb-arm64.deb
